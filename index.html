<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KGVR Health</title>
<style>
  :root{--ease:cubic-bezier(.22,.61,.36,1)}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  body{font-family:Georgia,"Times New Roman",serif}

  /* The artwork is the complete visual surface. Nothing is recreated in CSS. */
  .stage{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;background:#000}
  .hero-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
  .hero{display:block;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none;-webkit-user-drag:none}

  /* Transparent hit areas sit exactly over the controls already printed in the artwork. */
  .hit{position:absolute;z-index:10;display:block;background:transparent;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .hit:focus-visible{outline:2px solid rgba(255,255,255,.9);outline-offset:3px;border-radius:999px}

  /* Button position is proportional to each source artwork. */
  .enter-hit{left:32.15%;top:56.65%;width:27.7%;height:7.5%}
  .menu-hit{right:4.1%;top:10.0%;width:7.5%;height:9.5%}

  /* Portrait artwork has its own coordinate system. */
  @media (max-aspect-ratio: 4/5){
    .hero{content:url("assets/kgvr-health-mobile.jpg");object-fit:cover}
    .enter-hit{left:23.5%;top:52.0%;width:53%;height:4.9%}
    .menu-hit{right:7.0%;top:8.3%;width:10%;height:8.5%}
  }

  /* Menu overlay: clicking the printed hamburger actually does something. */
  .menu-layer{position:fixed;inset:0;z-index:30;visibility:hidden;pointer-events:none}
  .menu-layer.open{visibility:visible;pointer-events:auto}
  .menu-scrim{position:absolute;inset:0;background:rgba(0,0,0,.28);opacity:0;transition:opacity .35s var(--ease)}
  .menu-panel{position:absolute;top:0;right:0;width:min(430px,88vw);height:100%;background:rgba(20,20,20,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transform:translateX(100%);transition:transform .45s var(--ease);padding:34px 30px;color:#fff}
  .menu-layer.open .menu-scrim{opacity:1}
  .menu-layer.open .menu-panel{transform:translateX(0)}
  .menu-close{position:absolute;top:27px;right:27px;width:48px;height:48px;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:transparent;color:#fff;font:28px/1 Georgia,serif;cursor:pointer}
  .menu-title{margin:72px 0 42px;font-size:30px;letter-spacing:.04em;font-weight:400}
  .menu-links{display:flex;flex-direction:column;gap:24px}
  .menu-links a{color:#fff;text-decoration:none;font-size:22px;letter-spacing:.02em;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.18)}
  .menu-links a:hover{opacity:.7}

  @media (max-aspect-ratio: 4/5){
    .menu-panel{width:86vw;padding:28px 24px}
  }

  @media (prefers-reduced-motion:reduce){
    .menu-panel,.menu-scrim{transition:none}
  }
</style>
</head>
<body>
<main class="stage" aria-label="KGVR Health entrance">
  <div class="hero-wrap">
    <img
      class="hero"
      src="assets/kgvr-health-desktop.jpg"
      alt="KGVR Health — Health, reimagined"
      draggable="false"
    >

    <!-- Invisible clickable layer over the exact printed Button → -->
    <a class="hit enter-hit" href="home.html" aria-label="Enter KGVR Health"></a>

    <!-- Invisible clickable layer over the exact printed hamburger icon -->
    <button class="hit menu-hit" type="button" aria-label="Open menu" aria-controls="site-menu" aria-expanded="false"></button>
  </div>
</main>

<section class="menu-layer" id="site-menu" aria-hidden="true">
  <button class="menu-scrim" type="button" aria-label="Close menu"></button>
  <aside class="menu-panel" aria-label="KGVR Health navigation">
    <button class="menu-close" type="button" aria-label="Close menu">×</button>
    <h2 class="menu-title">KGVR HEALTH</h2>
    <nav class="menu-links">
      <a href="home.html">Home</a>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </aside>
</section>

<script>
  const menuButton = document.querySelector('.menu-hit');
  const menuLayer = document.getElementById('site-menu');
  const closeButton = document.querySelector('.menu-close');
  const scrim = document.querySelector('.menu-scrim');

  function setMenu(open){
    menuLayer.classList.toggle('open', open);
    menuLayer.setAttribute('aria-hidden', String(!open));
    menuButton.setAttribute('aria-expanded', String(open));
    if(open) closeButton.focus();
  }

  menuButton.addEventListener('click', () => setMenu(true));
  closeButton.addEventListener('click', () => setMenu(false));
  scrim.addEventListener('click', () => setMenu(false));
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape') setMenu(false);
  });
</script>
</body>
</html>
