<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>KGVR Health</title>

  @font-face {
  font-family: "The Seasons";
  src: url("assets/the-seasons.otf") format("opentype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
  <style>
    :root {
      --ease: cubic-bezier(.22,.61,.36,1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }

    html {
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }

    a,
    button {
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      -webkit-touch-callout: none;
      outline: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: "The Seasons", Georgia, "Times New Roman", serif;
    }


    /* =========================================
       ENTRANCE ARTWORK
       ========================================= */

    .stage {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100dvh;

      overflow: hidden;
      background: #000;
    }

    .hero-wrap {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      background: #000;
    }

    .hero {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      user-select: none;
      -webkit-user-drag: none;
    }


    /* =========================================
       INVISIBLE CLICK AREAS
       ========================================= */

    .hit {
      position: absolute;

      z-index: 10;

      display: block;

      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .hit:focus-visible {
      outline: 2px solid rgba(255,255,255,.9);
      outline-offset: 3px;
      border-radius: 999px;
    }


    /* Desktop entrance button */

    .enter-hit {
      left: 32.15%;
      top: 56.65%;

      width: 27.7%;
      height: 7.5%;
    }


    /* Desktop hamburger */

    .menu-hit {
      right: 4.1%;
      top: 10%;

      width: 7.5%;
      height: 9.5%;
    }


    /* =========================================
       MOBILE ARTWORK
       ========================================= */

    @media (max-aspect-ratio: 4/5) {

      .hero {
        content: url("assets/kgvr-health-mobile.jpg");
        object-fit: cover;
      }

      .enter-hit {
        left: 23.5%;
        top: 52%;

        width: 53%;
        height: 4.9%;
      }

      .menu-hit {
        right: 7%;
        top: 8.3%;

        width: 10%;
        height: 8.5%;
      }
    }


    /* =========================================
       MENU OVERLAY
       ========================================= */

    .menu-layer {
      position: fixed;
      inset: 0;

      z-index: 30;

      visibility: hidden;
      pointer-events: none;
    }

    .menu-layer.open {
      visibility: visible;
      pointer-events: auto;
    }


    /* Background behind the glass */

    .menu-scrim {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
      padding: 0;

      background: rgba(20,20,20,.25);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      opacity: 0;

      transition:
        opacity .35s var(--ease);

      cursor: pointer;
    }


    /* =========================================
       FROSTED GLASS MENU PANEL
       ========================================= */

    .menu-panel {
      position: absolute;

      top: 18px;
      right: 18px;

      width: min(430px, calc(100vw - 36px));
      height: calc(100% - 36px);

      padding: 34px 30px;

      color: #fff;

      /*
        Frosted glass
      */

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.22),
          rgba(255,255,255,.08)
        );

      border:
        1px solid rgba(255,255,255,.42);

      border-radius: 6px;

      backdrop-filter:
        blur(28px)
        saturate(125%);

      -webkit-backdrop-filter:
        blur(28px)
        saturate(125%);

      box-shadow:
        0 20px 70px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.25);

      transform: translateX(calc(100% + 30px));

      transition:
        transform .45s var(--ease);

      overflow-y: auto;
    }


    /* Glass panel subtle highlight */

    .menu-panel::before {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      border-radius: inherit;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.12),
          transparent 45%
        );
    }


    .menu-layer.open .menu-scrim {
      opacity: 1;
    }

    .menu-layer.open .menu-panel {
      transform: translateX(0);
    }


    /* =========================================
       CLOSE BUTTON
       ========================================= */

    .menu-close {
      position: absolute;

      top: 22px;
      right: 22px;

      width: 48px;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid rgba(255,255,255,.40);

      border-radius: 50%;

      background:
        rgba(255,255,255,.10);

      color: #fff;

      font:
        28px/1 "The Seasons",
        Georgia,
        serif;

      cursor: pointer;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      transition:
        background .2s ease,
        transform .2s ease;
    }

    .menu-close:hover {
      background:
        rgba(255,255,255,.20);

      transform: rotate(5deg);
    }


    /* =========================================
       MENU CONTENT
       ========================================= */

    .menu-title {
      position: relative;

      margin:
        72px 0 44px;

      color: #fff;

      font-family:
        "The Seasons",
        Georgia,
        serif;

      font-size: 30px;
      font-weight: 400;

      letter-spacing: .02em;

      text-shadow:
        0 2px 8px rgba(0,0,0,.20);
    }

    .menu-links {
      position: relative;

      display: flex;
      flex-direction: column;

      gap: 0;
    }

    .menu-links a {
      color: #fff;

      text-decoration: none;

      font-family:
        "The Seasons",
        Georgia,
        serif;

      font-size: 22px;
      font-weight: 400;

      letter-spacing: .02em;

      padding:
        18px 4px;

      border-bottom:
        1px solid rgba(255,255,255,.25);

      text-shadow:
        0 1px 5px rgba(0,0,0,.18);

      transition:
        opacity .2s ease,
        padding-left .2s ease;
    }

    .menu-links a:first-child {
      border-top:
        1px solid rgba(255,255,255,.25);
    }

    .menu-links a:hover {
      opacity: .72;
      padding-left: 10px;
    }


    /* =========================================
       MOBILE MENU
       ========================================= */

    @media (max-aspect-ratio: 4/5) {

      .menu-panel {
        top: 10px;
        right: 10px;

        width: calc(100% - 20px);
        height: calc(100% - 20px);

        padding:
          28px 24px;

        border-radius: 8px;

        backdrop-filter:
          blur(24px)
          saturate(120%);

        -webkit-backdrop-filter:
          blur(24px)
          saturate(120%);
      }

      .menu-title {
        margin-top: 68px;

        font-size: 27px;
      }

      .menu-links a {
        font-size: 20px;
      }
    }


    /* =========================================
       REDUCED MOTION
       ========================================= */

    @media (prefers-reduced-motion: reduce) {

      .menu-panel,
      .menu-scrim {
        transition: none;
      }
    }
  </style>
</head>


<body>


  <!-- =========================================
       ENTRANCE PAGE
       ========================================= -->

  <main
    class="stage"
    aria-label="KGVR Health entrance"
  >

    <div class="hero-wrap">

      <img
        class="hero"
        src="assets/kgvr-health-desktop.jpg"
        alt="KGVR Health — Health, reimagined"
        draggable="false"
      >


      <!-- ENTER BUTTON -->

      <a
        class="hit enter-hit"
        href="healthhome.html"
        aria-label="Enter KGVR Health"
      ></a>


      <!-- HAMBURGER -->

      <button
        class="hit menu-hit"
        type="button"
        aria-label="Open menu"
        aria-controls="site-menu"
        aria-expanded="false"
      ></button>

    </div>

  </main>


  <!-- =========================================
       FROSTED GLASS MENU
       ========================================= -->

  <section
    class="menu-layer"
    id="site-menu"
    aria-hidden="true"
  >

    <!-- Blurred background -->

    <button
      class="menu-scrim"
      type="button"
      aria-label="Close menu"
    ></button>


    <!-- Glass panel -->

    <aside
      class="menu-panel"
      aria-label="KGVR Health navigation"
    >

      <button
        class="menu-close"
        type="button"
        aria-label="Close menu"
      >
        ×
      </button>


      <h2 class="menu-title">
        KGVR HEALTH
      </h2>


      <nav class="menu-links">

        <a href="healthhome.html">
          Home
        </a>

        <a href="#about">
          About
        </a>

        <a href="#services">
          Services
        </a>

        <a href="#contact">
          Contact
        </a>

      </nav>

    </aside>

  </section>


  <!-- =========================================
       MENU JAVASCRIPT
       ========================================= -->

  <script>

    const menuButton =
      document.querySelector('.menu-hit');

    const menuLayer =
      document.getElementById('site-menu');

    const closeButton =
      document.querySelector('.menu-close');

    const scrim =
      document.querySelector('.menu-scrim');


    function setMenu(open) {

      menuLayer.classList.toggle(
        'open',
        open
      );

      menuLayer.setAttribute(
        'aria-hidden',
        String(!open)
      );

      menuButton.setAttribute(
        'aria-expanded',
        String(open)
      );

      if (open) {
        closeButton.focus();
      }
    }


    menuButton.addEventListener(
      'click',
      () => setMenu(true)
    );


    closeButton.addEventListener(
      'click',
      () => setMenu(false)
    );


    scrim.addEventListener(
      'click',
      () => setMenu(false)
    );


    document.addEventListener(
      'keydown',
      event => {

        if (event.key === 'Escape') {
          setMenu(false);
        }

      }
    );

  </script>

</body>
  </html>
